<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<title>ObjectNumber - Visual Test Page - sap.m</title>
		<script src="shared-config.js"></script>
		<script src="../../../resources/sap-ui-core.js"
			id="sap-ui-bootstrap"
			data-sap-ui-libs="sap.m">
		</script>
		<script>

			conston1 = new sap.m.ObjectNumber("on1", {
				number: "300,000,000",
				unit: "Euro"
			}).addStyleClass("sapUiSmallMargin");

			conston2 = new sap.m.ObjectNumber("on2", {
				number: "300,000,000",
				unit: "Euro"
			}).addStyleClass("sapMObjectNumberLarge").addStyleClass("sapUiSmallMargin");

			constoButtonEmphasized = new sap.m.Button("emphasized", {
				text:"Toggle emphasized",
				press: function(){
					on1.setEmphasized(!on1.getEmphasized());
					on2.setEmphasized(!on2.getEmphasized());
				}
			});

			constoButtonNum = new sap.m.Button("num", {
				text:"Set number",
				press: function(){
					on1.setNumber("100");
					on2.setNumber("100");
				}
			});

			constoButtonUnit = new sap.m.Button("unit", {
				text:"Set unit",
				press: function(){
					on1.setUnit("Dollars");
					on2.setUnit("Dollars");
				}
			});

			constoButtonStateS = new sap.m.Button("change_stateS", {
				text:"Success state",
				press: function(){
					on1.setState(sap.ui.core.ValueState.Success);
					on2.setState(sap.ui.core.ValueState.Success);
				}
			});

			constoButtonStateE = new sap.m.Button("change_stateE", {
				text:"Error state",
				press: function(){
					on1.setState(sap.ui.core.ValueState.Error);
					on2.setState(sap.ui.core.ValueState.Error);
				}
			});

			constoButtonStateW = new sap.m.Button("change_stateW", {
				text:"Warning state",
				press: function(){
					on1.setState(sap.ui.core.ValueState.Warning);
					on2.setState(sap.ui.core.ValueState.Warning);
				}
			});

			constoButtonStateI = new sap.m.Button("change_stateI", {
				text:"Information state",
				press: function(){
					on1.setState(sap.ui.core.ValueState.Information);
					on2.setState(sap.ui.core.ValueState.Information);
				}
			});

			conston3 = new sap.m.ObjectNumber("on3", {
				number: "300",
				unit: "Euro",
				active: true
			}).addStyleClass("sapUiSmallMargin");

			conston4 = new sap.m.ObjectNumber("on4", {
				number: "300000",
				unit: "Euro",
				active: true
			}).addStyleClass("sapMObjectNumberLarge").addStyleClass("sapUiSmallMargin");

			conston5 = new sap.m.ObjectNumber("on5", {
				number: "1.50",
				active: true,
				inverted: true
			}).addStyleClass("sapUiSmallMargin");

			conston6 = new sap.m.ObjectNumber("on6", {
				number: "1.50",
				unit: "Euro",
				inverted: true
			}).addStyleClass("sapUiSmallMargin");

			conston7 = new sap.m.ObjectNumber("on7", {
				number: "300000",
				unit: "Euro",
				inverted: true,
				active: true
			}).addStyleClass("sapMObjectNumberLarge").addStyleClass("sapUiSmallMargin");

			constObjectNumberDisplayMode = sap.m.ObjectNumberDisplayMode;

			// --- Currency mode ---

			// USD, useSymbol=true (default) → symbol "$"
			constonCurrency1 = new sap.m.ObjectNumber("onCurrency1", {
				number: "1234.5",
				unit: "USD",
				displayMode: ObjectNumberDisplayMode.Currency
			});

			// USD, useSymbol=false → ISO code "USD"
			constonCurrency2 = new sap.m.ObjectNumber("onCurrency2", {
				number: "1234.5",
				unit: "USD",
				displayMode: ObjectNumberDisplayMode.Currency,
				useSymbol: false
			});

			// EUR, maxPrecision=4 → 2 extra figure-space padding digits
			constonCurrency3 = new sap.m.ObjectNumber("onCurrency3", {
				number: "99",
				unit: "EUR",
				displayMode: ObjectNumberDisplayMode.Currency,
				maxPrecision: 4
			});

			// JPY — 0 CLDR decimal digits, edge case
			constonCurrency4 = new sap.m.ObjectNumber("onCurrency4", {
				number: "12000",
				unit: "JPY",
				displayMode: ObjectNumberDisplayMode.Currency
			});

			// CHF — standard 2 decimal digits, maxPrecision matches CLDR (no padding)
			constonCurrency5 = new sap.m.ObjectNumber("onCurrency5", {
				number: "750",
				unit: "CHF",
				displayMode: ObjectNumberDisplayMode.Currency,
				maxPrecision: 2
			});

			// --- Unit mode ---

			// kg, no maxPrecision → integer rendering
			constonUnit1 = new sap.m.ObjectNumber("onUnit1", {
				number: "42",
				unit: "kg",
				displayMode: ObjectNumberDisplayMode.Unit
			});

			// km, maxPrecision=2 → formatted to 2 decimal places
			constonUnit2 = new sap.m.ObjectNumber("onUnit2", {
				number: "3.5",
				unit: "km",
				displayMode: ObjectNumberDisplayMode.Unit,
				maxPrecision: 2
			});

			// m², maxPrecision=3 → formatted to 3 decimal places
			constonUnit3 = new sap.m.ObjectNumber("onUnit3", {
				number: "0.5",
				unit: "m²",
				displayMode: ObjectNumberDisplayMode.Unit,
				maxPrecision: 3
			});

			// useSymbol=true has no effect in Unit mode — raw unit string shown
			constonUnit4 = new sap.m.ObjectNumber("onUnit4", {
				number: "100",
				unit: "kWh",
				displayMode: ObjectNumberDisplayMode.Unit,
				useSymbol: true
			});

			// emphasized unit
			constonUnit5 = new sap.m.ObjectNumber("onUnit5", {
				number: "200",
				unit: "kg",
				displayMode: ObjectNumberDisplayMode.Unit,
				emphasized: true
			});

			constapp = new sap.m.App();
			constpage = new sap.m.Page({
				showHeader : false,
				enableScrolling : true,
				content: [
					on1,
					on2,
					oButtonEmphasized,
					oButtonNum,
					oButtonUnit,
					oButtonStateS,
					oButtonStateE,
					oButtonStateW,
					oButtonStateI,
					on3,
					on4,
					on5,
					on6,
					on7,
					new sap.m.Title({ text: "Currency mode" }).addStyleClass("sapUiSmallMarginBegin"),
					new sap.m.VBox({
						renderType: "Bare",
						items: [onCurrency1, onCurrency2, onCurrency3, onCurrency4, onCurrency5]
					}).addStyleClass("sapUiSmallMarginBeginEnd"),
					new sap.m.Title({ text: "Unit mode" }).addStyleClass("sapUiSmallMarginBegin"),
					new sap.m.VBox({
						renderType: "Bare",
						items: [onUnit1, onUnit2, onUnit3, onUnit4, onUnit5]
					}).addStyleClass("sapUiSmallMarginBeginEnd")
				]
			});
			app.setInitialPage(page.getId());
			app.addPage(page);

			app.placeAt('body');
		</script>
	</head>
	<body id="body" class="sapUiBody">
	</body>
</html>
