<script>
sinon.config.useFakeTimers = true;

// Build a mock location object (origin/protocol/host) from a URL string, without
// relying on the URL constructor which is unavailable in the browsers this test targets.
// Opaque documents (e.g. data: URIs) yield the literal "null" origin.
function parseOrigin(sUrl) {
	var aScheme = String(sUrl).split("//");
	if (aScheme.length < 2 || /^(?:data|blob|file|about):/.test(sUrl)) {
		return { origin: "null", protocol: "null", host: "" };
	}
	var sProtocol = aScheme[0];
	var sHost = aScheme[1].split("/")[0];
	return { origin: sProtocol + "//" + sHost, protocol: sProtocol, host: sHost };
}

function mockBrowserAPI(oTest, mOptions) {

	var sParentOrigin = mOptions.parentOrigin || 'http://some.other.origin.local';

	// holds mocked functions for assertions
	var oSpies = {
		window: {},
		parent: {}
	};

	// window
	jQuery.sap.FrameOptions.__window = {};
	jQuery.sap.FrameOptions.__window.location = parseOrigin(mOptions.selfUrl || 'http://localhost/fake.html');
	oSpies.window.addEventListener = oTest.spy(function() {
		oSpies.window.eventListenerFn = arguments[1];
		oSpies.window.eventListener = oTest.spy(arguments[1]);
	});
	if (window.addEventListener) {
		jQuery.sap.FrameOptions.__window.addEventListener = oSpies.window.addEventListener;
	} else {
		jQuery.sap.FrameOptions.__window.attachEvent = oSpies.window.addEventListener;
	}

	// parent
	jQuery.sap.FrameOptions.__parent = {};

	jQuery.sap.FrameOptions.__parent.postMessage = oSpies.parent.postMessage = oTest.spy(function(sMessage, sTargetOrigin) {
		if (sMessage === 'SAPFrameProtection*require-origin') {
			switch (mOptions.parentMode) {
				case "SAFE":
					setTimeout(function() {
						oSpies.window.eventListener.call(null, {
							source: jQuery.sap.FrameOptions.__parent,
							data: 'SAPFrameProtection*parent-unlocked',
							origin: sParentOrigin
						});
					}, 0);
					break;
				case "UNSAFE":
					setTimeout(function() {
						oSpies.window.eventListener.call(null, {
							source: jQuery.sap.FrameOptions.__parent,
							data: 'SAPFrameProtection*parent-origin',
							origin: sParentOrigin
						});
					}, 0);
					break;
				case "SAFE_DELAYED":
					setTimeout(function() {
						oSpies.window.eventListener.call(null, {
							source: jQuery.sap.FrameOptions.__parent,
							data: 'SAPFrameProtection*parent-origin',
							origin: sParentOrigin
						});
					}, 0);
					setTimeout(function() {
						oSpies.window.eventListener.call(null, {
							source: jQuery.sap.FrameOptions.__parent,
							data: 'SAPFrameProtection*parent-unlocked',
							origin: sParentOrigin
						});
					}, 100);
					break;
			}
		}
	});


	if (mOptions.mode !== 'DIFF_ORIGIN') {
		jQuery.sap.FrameOptions.__parent.document = {
			domain: 'localhost'
		};
	}

	// self / top
	if (mOptions.mode === 'NO_FRAME') {
		jQuery.sap.FrameOptions.__top = jQuery.sap.FrameOptions.__self = jQuery.sap.FrameOptions.__parent;
	} else {
		jQuery.sap.FrameOptions.__top = jQuery.sap.FrameOptions.__parent;
		jQuery.sap.FrameOptions.__self = {};
	}

	return oSpies;
}

function testDirectUnlock(sName, sEnvMode, sParentMode, sMode, bAllowSameOrigin) {
	test(sName, function() {

		// arrangements
		var oMock = mockBrowserAPI(this, {
			mode: sEnvMode,
			parentMode: sParentMode
		});
		var fnCallback = this.spy();

		// actions
		this.oFrameOptions = new jQuery.sap.FrameOptions({
			mode: sMode,
			allowSameOrigin: bAllowSameOrigin,
			callback: fnCallback
		});

		// assertions
		sinon.assert.calledOnce(oMock.window.addEventListener);
		sinon.assert.calledWith(oMock.window.addEventListener, jQuery.sap.FrameOptions.__window.addEventListener ? 'message' : 'onmessage', oMock.window.eventListenerFn);

		sinon.assert.notCalled(oMock.window.eventListener);

		sinon.assert.notCalled(oMock.parent.postMessage);

		sinon.assert.calledOnce(fnCallback);
		sinon.assert.calledWith(fnCallback, true);
	});
}
function testDirectLock(sName, sEnvMode, sParentMode, sMode, bAllowSameOrigin) {
	test(sName, function() {

		// arrangements
		var oMock = mockBrowserAPI(this, {
			mode: sEnvMode,
			parentMode: sParentMode
		});
		var fnCallback = this.spy();

		// actions
		this.oFrameOptions = new jQuery.sap.FrameOptions({
			mode: sMode,
			allowSameOrigin: bAllowSameOrigin,
			callback: fnCallback
		});

		// assertions
		sinon.assert.calledOnce(oMock.window.addEventListener);
		sinon.assert.calledWith(oMock.window.addEventListener, jQuery.sap.FrameOptions.__window.addEventListener ? 'message' : 'onmessage', oMock.window.eventListenerFn);

		sinon.assert.notCalled(oMock.window.eventListener);

		sinon.assert.notCalled(oMock.parent.postMessage);

		sinon.assert.calledOnce(fnCallback);

		ok(jQuery.contains(document.body, this.oFrameOptions._lockDiv), 'Block layer should be part of the DOM');
		equals(this.oFrameOptions._lockDiv.style.zIndex, '2147483647', 'Block layer should have a high z-index');
	});
}
function testPostMessageLock(sName, sEnvMode, sParentMode, sMode, bAllowSameOrigin) {
	test(sName, function() {

		// arrangements
		var oMock = mockBrowserAPI(this, {
			mode: sEnvMode,
			parentMode: sParentMode
		});
		var fnCallback = this.spy();

			mode: sMode,
			allowSameOrigin: bAllowSameOrigin,

		});

		// assertions

		sinon.assert.calledWith(oMock.window.addEventListener, jQuery.sap.FrameOptions.__window.addEventListener ? 'message' : 'onmessage', oMock.window.eventListenerFn);

		this.clock.tick(10);

		sinon.assert.calledOnce(oMock.window.eventListener);
		sinon.assert.calledWith(oMock.window.eventListener, {

function testWhitelistMatch(sName, sEnvMode, sParentMode, sMode, bAllowSameOrigin, sParentOrigin, aWhitelist, bAllow) {
	test(sName, function() {

		// arrangements
		var oMock = mockBrowserAPI(this, {
			mode: sEnvMode,
			parentMode: sParentMode,
			parentOrigin: sParentOrigin
		});
		var fnCallback = this.spy();

		// actions
		this.oFrameOptions = new jQuery.sap.FrameOptions({
			mode: sMode,
			allowSameOrigin: bAllowSameOrigin,
			whitelist: aWhitelist,
			callback: fnCallback
		});

		// assertions
		this.clock.tick(10);

		sinon.assert.calledOnce(oMock.parent.postMessage);
		sinon.assert.calledWith(oMock.parent.postMessage, 'SAPFrameProtection*require-origin', '*');

		sinon.assert.calledOnce(fnCallback);
		ok(
			fnCallback.calledWith(bAllow),
			"Parent origin '" + sParentOrigin + "' against whitelist " +
				JSON.stringify(aWhitelist) + " should " + (bAllow ? "" : "NOT ") + "be trusted"
		);
	});
}
function testSameOriginMatch(sName, sParentOrigin, sSelfUrl, bAllow) {
	test(sName, function() {

		// arrangements: cross-origin frame whose parent reports sParentOrigin,
		// no whitelist configured. The only path that can grant trust is the
		// same-origin equality check against window.location.origin.
		var oMock = mockBrowserAPI(this, {
			mode: 'DIFF_ORIGIN',
			parentMode: 'SAFE',
			parentOrigin: sParentOrigin,
			selfUrl: sSelfUrl
		});
		var fnCallback = this.spy();

		// actions
		this.oFrameOptions = new jQuery.sap.FrameOptions({
			mode: 'trusted',
			allowSameOrigin: true,
			callback: fnCallback
		});

		// assertions
		this.clock.tick(10);

		sinon.assert.calledOnce(oMock.parent.postMessage);
		sinon.assert.calledWith(oMock.parent.postMessage, 'SAPFrameProtection*require-origin', '*');

		sinon.assert.calledOnce(fnCallback);
		ok(
			fnCallback.calledWith(bAllow),
			"Parent '" + sParentOrigin + "' framing self '" + sSelfUrl +
				"' should " + (bAllow ? "" : "NOT ") + "be trusted as same-origin"
		);
	});
}
function testWhitelistService(sName, sEnvMode, sParentMode, sMode, bAllowSameOrigin, bActive, bFraming, bAllow) {
	test(sName, function() {

		// arrangements
		var oMock = mockBrowserAPI(this, {
			mode: sEnvMode,
			parentMode: sParentMode
		});

		var oServer = this.sandbox.useFakeServer(),
			oResponse = {
				version: "1.0",
				active: !!bActive,
				origin: "http://some.other.origin.local",
				framing: !!bFraming
			};
		oServer.respondWith("GET", /\/whitelist\.json\?parentOrigin=.*/, [
			200,
			{
				"Content-Type": "application/json"
			},
			JSON.stringify(oResponse)
		]);

		var fnCallback = this.spy();

		// actions
		this.oFrameOptions = new jQuery.sap.FrameOptions({
			mode: sMode,
			allowSameOrigin: bAllowSameOrigin,
			whitelistService: '/whitelist.json',
			callback: fnCallback,
			timeout: 200
		});

		// assertions
		sinon.assert.calledOnce(oMock.window.addEventListener);
		sinon.assert.calledWith(oMock.window.addEventListener, jQuery.sap.FrameOptions.__window.addEventListener ? 'message' : 'onmessage', oMock.window.eventListenerFn);

		this.clock.tick(10);

		oServer.respond();

		if (sParentMode == "SAFE") {
			sinon.assert.calledOnce(oMock.window.eventListener);
			sinon.assert.calledWith(oMock.window.eventListener, {
				source: jQuery.sap.FrameOptions.__parent,
				origin: 'http://some.other.origin.local',
				data: 'SAPFrameProtection*parent-unlocked'
			});
		} else if (sParentMode == "UNSAFE")	{
			sinon.assert.calledOnce(oMock.window.eventListener);
			sinon.assert.calledWith(oMock.window.eventListener, {
				source: jQuery.sap.FrameOptions.__parent,
				origin: 'http://some.other.origin.local',
				data: 'SAPFrameProtection*parent-origin'
			});
		} else if (sParentMode == "SAFE_DELAYED")	{
			sinon.assert.calledOnce(oMock.window.eventListener);
			sinon.assert.calledWith(oMock.window.eventListener, {
				source: jQuery.sap.FrameOptions.__parent,
				origin: 'http://some.other.origin.local',
				data: 'SAPFrameProtection*parent-origin'
			});
			oMock.window.eventListener.reset();
		} else {
			sinon.assert.notCalled(oMock.window.eventListener);
		}

		sinon.assert.calledOnce(oMock.parent.postMessage);
		sinon.assert.calledWith(oMock.parent.postMessage, 'SAPFrameProtection*require-origin', '*');

		this.clock.tick(200);

		if (sParentMode == "SAFE_DELAYED")	{
			sinon.assert.calledOnce(oMock.window.eventListener);
			sinon.assert.calledWith(oMock.window.eventListener, {
				source: jQuery.sap.FrameOptions.__parent,
				origin: 'http://some.other.origin.local',
				data: 'SAPFrameProtection*parent-unlocked'
			});
		}

		sinon.assert.calledOnce(fnCallback);
		sinon.assert.calledWith(fnCallback, bAllow);

	});
}

function teardown() {
	if (this.oFrameOptions && this.oFrameOptions._lockDiv) {
		document.body.removeChild(this.oFrameOptions._lockDiv);
	}
	this.oFrameOptions = null;
}

sap.ui.test.qunit.delayTestStart();

// environment
// NO_FRAME: not running inside of a frame
// SAME_ORIGIN: framed, but with the same origin
// DOMAIN_RELAX: framed, same origin but domain relaxed, so no direct access possibles
// DIFF_ORIGIN: framed, within a different origin

// parent mode
// SAFE: has the postmessage script and reports to be safe
// UNSAFE: has the postmessage script but only responds parent-origin
// SAFE_DELAYED: has the postmessage script, but sends parent-unlocked with one second delay
// NO_HANDLER: no postmessage handler is running in the parent

//                    test name,                                  environment,     parent mode,    frame option

module("mode: deny", { teardown: teardown });
testDirectUnlock(    "no frame",                                  'NO_FRAME',      'SAFE',         'deny');
testDirectLock(      "same origin",                               'SAME_ORIGIN',   'SAFE',         'deny');
testDirectLock(      "different origin",                          'DIFF_ORIGIN',   'SAFE',         'deny');

module("mode: allow", { teardown: teardown });
testDirectUnlock(    "no frame",                                  'NO_FRAME',      'SAFE',         'allow');
testDirectUnlock(    "same origin",                               'SAME_ORIGIN',   'SAFE',         'allow');
testDirectUnlock(    "different origin",                          'DIFF_ORIGIN',   'SAFE',         'allow');

//                    test name,                                  environment,     parent mode,    frame option,  same origin,

module("mode: trusted", { teardown: teardown });
testDirectUnlock(    "no frame",                                  'NO_FRAME',      'SAFE',         'trusted');
testDirectUnlock(    "same origin",                               'SAME_ORIGIN',   'SAFE',         'trusted');
testDirectUnlock(    "same origin, unsafe",                       'SAME_ORIGIN',   'UNSAFE',       'trusted');
testDirectUnlock(    "same origin, no response",                  'SAME_ORIGIN',   'NO_RESPONSE',  'trusted');

testPostMessageLock( "same origin not allowed",                   'SAME_ORIGIN',   'SAFE',         'trusted',     false);
testPostMessageLock( "different origin",                          'DIFF_ORIGIN',   'SAFE',         'trusted');

module("mode: trusted, whitelist", { teardown: teardown });
testWhitelistUnlock( "same origin not allowed, whitelist",        'SAME_ORIGIN',   'SAFE',         'trusted',     false);
testWhitelistUnlock( "different origin, whitelist",               'DIFF_ORIGIN',   'SAFE',         'trusted');

//                   test name,                                   environment,     parent mode,    frame option,  same origin,  active,   framing,  allow

module("mode: trusted, witelist service, parent safe", { teardown: teardown });
testWhitelistService("same origin not allowed, whitelistService", 'SAME_ORIGIN',   'SAFE',         'trusted',     false,        true,     true,     true);
testWhitelistService("diff origin, whitelistService",             'DIFF_ORIGIN',   'SAFE',         'trusted',     true,         true,     true,     true);
testWhitelistService("diff origin, whitelistService, denied",     'DIFF_ORIGIN',   'SAFE',         'trusted',     true,         true,     false,    false);
testWhitelistService("diff origin, whitelistService, inactive",   'DIFF_ORIGIN',   'SAFE',         'trusted',     true,         false,    true,     true);

module("mode: trusted, witelist service, parent safe delayed", { teardown: teardown });
testWhitelistService("same origin not allowed, whitelistService", 'SAME_ORIGIN',   'SAFE_DELAYED', 'trusted',     false,        true,     true,     true);
testWhitelistService("diff origin, whitelistService",             'DIFF_ORIGIN',   'SAFE_DELAYED', 'trusted',     true,         true,     true,     true);
testWhitelistService("diff origin, whitelistService, denied",     'DIFF_ORIGIN',   'SAFE_DELAYED', 'trusted',     true,         true,     false,    false);
testWhitelistService("diff origin, whitelistService, inactive",   'DIFF_ORIGIN',   'SAFE_DELAYED', 'trusted',     true,         false,    true,     true);

module("mode: trusted, witelist service, parent unsafe", { teardown: teardown });
testWhitelistService("same origin not allowed, whitelistService", 'SAME_ORIGIN',   'UNSAFE',       'trusted',     false,        true,     true,     false);
testWhitelistService("diff origin, whitelistService",             'DIFF_ORIGIN',   'UNSAFE',       'trusted',     true,         true,     true,     false);
testWhitelistService("diff origin, whitelistService, inactive",   'DIFF_ORIGIN',   'UNSAFE',       'trusted',     true,         false,    true,     true);

module("mode: trusted, witelist service, parent no response", { teardown: teardown });
testWhitelistService("same origin not allowed, whitelistService", 'SAME_ORIGIN',   'NO_RESPONSE',  'trusted',     false,        true,     true,     false);
testWhitelistService("diff origin, whitelistService",             'DIFF_ORIGIN',   'NO_RESPONSE',  'trusted',     true,         true,     true,     false);
testWhitelistService("diff origin, whitelistService, inactive",   'DIFF_ORIGIN',   'NO_RESPONSE',  'trusted',     true,         false,    true,     true);

// Whitelist host matching: an entry must match the full hostname or a
// dot-bounded suffix. Substring-only matches like "evilcompany.example"
// against ["company.example"] must NOT pass, otherwise an attacker who
// registers a lookalike domain can frame the app.

//                  test name,                              environment,    parent mode,  frame option,  same origin,  parent origin,                                    whitelist,                  allow
module("mode: trusted, whitelist host matching", { teardown: teardown });

// positive cases: exact host or proper subdomain
testWhitelistMatch("exact host match",                     'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example',                         ['company.example'],        true);
testWhitelistMatch("subdomain match",                      'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://www.company.example',                     ['company.example'],        true);
testWhitelistMatch("deep subdomain match",                 'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://foo.bar.company.example',                 ['company.example'],        true);

// negative cases: these must be rejected
testWhitelistMatch("prefix attack: evilcompany.example",   'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://evilcompany.example',                     ['company.example'],        false);
testWhitelistMatch("prefix attack: notcompany.example",    'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://notcompany.example',                      ['company.example'],        false);
testWhitelistMatch("prefix attack: attacker-company...",   'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://attacker-company.example',                ['company.example'],        false);
testWhitelistMatch("suffix attack: company.example.atk",   'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example.attacker.example',        ['company.example'],        false);
testWhitelistMatch("infix attack: x.company.example.atk",  'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://x.company.example.attacker.example',      ['company.example'],        false);

// leading-dot entry form (legacy behavior): ".company.example" restricts the
// match to proper subdomains. The apex "company.example" must NOT match.
testWhitelistMatch("dot-prefixed entry, apex rejected",    'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example',                         ['.company.example'],       false);
testWhitelistMatch("dot-prefixed entry, subdomain",        'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://sub.company.example',                     ['.company.example'],       true);
testWhitelistMatch("dot-prefixed entry, deep subdomain",   'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://foo.bar.company.example',                 ['.company.example'],       true);
testWhitelistMatch("dot-prefixed entry, prefix attack",    'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://evilcompany.example',                     ['.company.example'],       false);
testWhitelistMatch("dot-prefixed entry, suffix attack",    'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example.attacker.example',        ['.company.example'],       false);

// Pin the asymmetry between the two entry forms: bare entry includes the
// apex, dot-prefixed entry does not.
testWhitelistMatch("bare entry matches apex",              'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example',                         ['company.example'],        true);
testWhitelistMatch("dot-prefixed entry skips apex",        'DIFF_ORIGIN',  'SAFE',       'trusted',     true,         'http://company.example',                         ['.company.example'],       false);

// Same-origin host matching: the allowSameOrigin branch must compare full
// origins (scheme + host + port) instead of string-prefixing the parent
// origin against document.URL. Lookalike hostnames and port mismatches must
// not be trusted.
//
//                   test name,                                 parent origin,                              self URL,                                                          allow
module("mode: trusted, same-origin host matching", { teardown: teardown });

// positive case: true same-origin parent and self
testSameOriginMatch("exact same origin",                       'https://intranet.company.example',         'https://intranet.company.example/app/index.html',                true);

// negative cases: these must be rejected
testSameOriginMatch("domain-prefix attack: company.example framing company.example.attacker.example",
                                                               'https://company.example',                  'https://company.example.attacker.example/app',                   false);
testSameOriginMatch("port mismatch: parent :443 vs self :8443",'https://intranet.company.example',         'https://intranet.company.example:8443/app',                      false);

// Opaque self-origin (sandboxed iframe, data:/blob: document) must NOT be
// considered same-origin even if the parent reports the same "null" string.
// Two opaque origins are not the same origin per the HTML spec.
testSameOriginMatch("opaque self vs opaque parent rejected",   'null',                                     'data:text/html,<p>x</p>',                                        false);
testSameOriginMatch("opaque self vs https parent rejected",    'https://intranet.company.example',         'data:text/html,<p>x</p>',                                        false);
