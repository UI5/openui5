<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>sap.ui.core.tooltip.TooltipEnablement - showcase</title>
		<script src="../shared-config.js"></script>
		<script src="../../../../../resources/sap-ui-core.js"
			id="sap-ui-bootstrap"
			data-sap-ui-libs="sap.m"
			data-sap-ui-compat-version="edge"
			data-sap-ui-async="true"
			data-sap-ui-xx-tooltip="enhanced"
			data-sap-ui-on-init="module:local/TooltipEnablement"
			data-sap-ui-resource-roots='{
				"local": "./"
			}'>
		</script>
		<style>
			html, body { height: 100%; }
			.fakeButton {
				font: inherit;
				height: 2.25rem;
				padding: 0 0.9rem;
				margin-right: 0.75rem;
				cursor: pointer;
				border: 1px solid #b3b3b3;
				border-radius: 0.5rem;
				background: #fff;
			}
			.fakeButton:hover {
				background: #f5f5f5;
			}
			.fakeButton:focus,
			.fakeText:focus,
			.fakeLink:focus,
			.fakeMultiTargetItem:focus {
				outline: 2px solid #000;
				outline-offset: -2px;
			}
			.fakeText {
				color: inherit;
				margin-right: 0.75rem;
			}
			.fakeLink {
				color: #0a6ed1;
				margin-right: 0.75rem;
			}
			.fakeMultiTarget {
				display: inline-flex;
				border: 1px solid #b3b3b3;
				border-radius: 0.25rem;
				padding: 0.25rem;
			}
			.fakeMultiTargetItem {
				border: 1px solid #b3b3b3;
				margin: 0.125rem;
				padding: 0.25rem 0.75rem;
				cursor: default;
			}
			/* Distinguish the sample's activation/long-press toast from the tooltip. */
			.sapMMessageToast {
				background: #e5f0fa !important;
				color: #0a3d6e !important;
				border: 1px solid #0070f2 !important;
				box-shadow: none;
			}
		</style>
	</head>
	<body class="sapUiBody" id="content"></body>
</html>
