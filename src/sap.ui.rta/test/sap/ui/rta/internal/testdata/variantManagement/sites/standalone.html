<!DOCTYPE HTML>
<html>

<head>

	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>RuntimeAuthoring - sap.ui.rta</title>

	<script id="sap-ui-bootstrap"
		src="../../../../../../../../resources/sap-ui-core.js"
		data-sap-ui-async="true"
		data-sap-ui-libs="sap.m, sap.ui.layout, sap.ui.comp, sap.ui.rta"
		data-sap-ui-theme="sap_belize"
		data-sap-ui-language="en"
		data-sap-ui-xx-bindingSyntax="complex"
		data-sap-ui-flexibility-services='[{"connector": "LocalStorageConnector"}]'
		data-sap-ui-resource-roots='{
			"sap.ui.rta.test.variantManagement": "../"
		}'
	></script>

	<script type="text/javascript">
		sap.ui.getCore().attachInit(function () {
			sap.ui.require([
				"sap/m/Shell",
				"sap/ui/core/ComponentContainer"
			], function (Shell, ComponentContainer) {

				return sap.ui.component({
					name: "sap.ui.rta.test.variantManagement",
					async: true
				})

				.then(function (oComponent) {
					return new ComponentContainer({
						height: "100%",
						component: oComponent,
						async: true
					})
				})

				.then(function (oComponentContainer) {
					// initialize the UI component
					return new Shell({
						app: oComponentContainer
					}).placeAt("content");
				});
			});
		});
	</script>
    <style>
        .sapUxAPObjectPageHeader .sapMBarRight {
            overflow: visible;
            margin: 0.375rem;
        }
        .sapUxAPObjectPageHeader .sapMBarRight > .sapMBarChild{
            padding: 0.125rem;
        }
    </style>
</head>

<body class="sapUiBody sapUiSizeCompact">
	<div id="content"></div>
</body>

</html>
