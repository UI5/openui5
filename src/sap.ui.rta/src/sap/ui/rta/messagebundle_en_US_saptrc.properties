TIT_TOUR_GENERAL_TITLE=8iBgainQGCvTreW2wZvsTA_General UI Adaptation Tour
TXT_TOUR_GENERAL_DESCRIPTION=iDmcRQ+e94+fRPPSIK4GoQ_It looks like you haven't used Key User Adaptation before. Would you like to take a tour of the core features now? If you'd prefer to take the tour later, you can start it from the "More Actions" menu at any time.

TIT_TOUR_GENERAL_STEP_UI_ADAPTATION_BUTTON_TITLE=2/CQsOsZXuDStdxxjdwYNQ_Adaptation Mode
TXT_TOUR_GENERAL_STEP_UI_ADAPTATION_BUTTON_DESCRIPTION=tZfZF8FkeGfaNjycYSKqYQ_In "Adaptation" mode, you make changes to the current screen. You can edit UI elements, adjust configurations, and customize the layout.

TIT_TOUR_GENERAL_STEP_NAVIGATION_BUTTON_TITLE=oDROPZjn1YX6fwqNjVeizw_Navigation Mode
TXT_TOUR_GENERAL_STEP_NAVIGATION_BUTTON_DESCRIPTION=HLR1DE0NF/m/2zh2MSEF8g_The "Navigation" mode is used to navigate to other parts of the application (e.g., from List Report to Object Page) or to open dialogs that are to be adapted. Changes made in this mode are not persisted, and should only be done (e.g. by setting a filter) in order to navigate to a different part of the application.

TIT_TOUR_GENERAL_STEP_VISUALIZATION_BUTTON_TITLE=UrqGtlOkP64yERjSHFmSCg_Visualization Mode
TXT_TOUR_GENERAL_STEP_VISUALIZATION_BUTTON_DESCRIPTION=U4mfgHlnlBm7Xf9feru38g_In "Visualization" mode, key user changes are highlighted. The change indicator shows, which elements contain changes. Click on the overlay to see details about all changes made to this element. A dropdown list in the header bar lets you filter for specific change types.

TIT_TOUR_GENERAL_STEP_CHANGE_LIST_DROPDOWN_TITLE=HBpKKyM9AmLRBOgm+MNabw_Changes Filter
TXT_TOUR_GENERAL_STEP_CHANGE_LIST_DROPDOWN_DESCRIPTION=eo1GrlfgwQYFy+QOosB8cg_The "Changes Filter" allows users to filter visualized changes by type and condition. You can choose to view all changes, which is the default setting. Alternatively, you can select draft changes, which are not yet activated, or unsaved changes, which are made in the current session and not yet saved.

TIT_TOUR_GENERAL_STEP_SAVE_BUTTON_TITLE=h5ETe4xhITnvoYs39FdK2g_Save Draft
TXT_TOUR_GENERAL_STEP_SAVE_BUTTON_DESCRIPTION=7V/CWFUuMHsIvxSN1S3qSQ_Click the "Save" button to save your UI changes. These changes are saved as a draft and aren't visible to end users until you activate them. Other key users can view them in UI Adaptation.

TIT_TOUR_GENERAL_STEP_UNDO_BUTTON_TITLE=2TzqHshgL4JiPrWJr+jd7g_Undo
TXT_TOUR_GENERAL_STEP_UNDO_BUTTON_DESCRIPTION=KG+0otdnBdI9vcLlzZnjHg_This button becomes active when there are unsaved changes. It lets you undo these changes one by one.

TIT_TOUR_GENERAL_STEP_REDO_BUTTON_TITLE=wPE+LCKCoyyhmHywUTc0Rg_Redo
TXT_TOUR_GENERAL_STEP_REDO_BUTTON_DESCRIPTION=D6/OE2brDayXV/uAwQsuzA_This button becomes active when you press the undo button. It lets you redo the undone changes one by one.

TIT_TOUR_GENERAL_STEP_ACTIVATE_VERSION_BUTTON_TITLE=xdNFye2mfcgVVVTao0PoXA_Activate New Version
TXT_TOUR_GENERAL_STEP_ACTIVATE_VERSION_BUTTON_DESCRIPTION=p+3Ft5To/Ve2qwB5B34D/w_Click the "Activate Version" button to save the current draft changes as a new version. This action makes the changes visible to end users.

TIT_TOUR_GENERAL_STEP_VERSIONS_DROPDOWN_TITLE=fGJ8VmP86rLThzi/QpqHNQ_Display Available Versions
TXT_TOUR_GENERAL_STEP_VERSIONS_DROPDOWN_DESCRIPTION=SuAnk5xXc01qZToM1qoyhQ_The dropdown list displays the most recent versions, highlights the currently active one, and includes an entry for the original app at the bottom. This lets users restart from an unchanged version if needed.

TIT_TOUR_GENERAL_STEP_PUBLISH_BUTTON_TITLE=HXrdfkvD/qFjlOgI8vTYlQ_Publish Active Versions
TXT_TOUR_GENERAL_STEP_PUBLISH_BUTTON_DESCRIPTION=TGYYWjo7DHRPicYtoUUjEQ_Create UI Adaptations in a test system first. After verifying them, publish them to productive systems. This button becomes active if there are active versions that haven't been transported yet.

TIT_TOUR_GENERAL_STEP_BURGER_MENU_TITLE=nfqt3VqyWJ3jecUJOoNrIg_More Actions
TXT_TOUR_GENERAL_STEP_BURGER_MENU_DESCRIPTION=01msP4dT/8S9OjAwdwYXEA_This menu displays additional actions, such as an overview of new features in RTA, an overview of app variants, and options for key users to translate modified textual elements. The available actions depend on the system you're using and the roles you're assigned to. The following actions are currently available\:
TXT_TOUR_GENERAL_STEP_BURGER_MENU_TRANSLATIONS=rFudRwdqRTbS8VvcvHJHSQ_When adapting the UI, you or other key users can rename UI texts. If you want to translate these UI texts into other languages, export the source-language texts first. Then import the translated texts.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_APP_VARIANTS=Kf1nOcK6f7Ak9w2+unHUOg_You can create variants of apps. These app variants are apps that are based on UI changes that key users make during UI adaptation.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_RESTORE=PPdVWh+UwYfAMqye+JHwWA_The restore action lets you revert the application to it's original state without any changes.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_NEW_FEATURES=rv0xl4izHLgCtxVkFJ7O/w_The "What's New" lists the new features in UI Adaptation, including those introduced in previous versions.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_GENERAL_TOUR=dqKvapeF+JDt3JsoZLMeaA_You can start the UI Adaptation Tour anytime from the "More Actions" menu.


TIT_TOUR_GENERAL_STEP_CONTEXT_BASED_ADAPTATIONS_TITLE=HYK6YTnA//E9HRpEXz3z1w_Adapting the UI for specific roles
TXT_TOUR_GENERAL_STEP_CONTEXT_BASED_ADAPTATIONS_DESCRIPTION=0f939mlAZLA984sr0Hh2Rg_You can customize the user interfaces of apps individually for specific user roles. For more information please review our <a href\="https\://help.sap.com/docs/FLP/124fa121c8674dce903cee2ff62b9c63/969cc16ff13e46c1b28001cc5e7189e0.html" target\="_blank">documentation</a>.

TIT_TOUR_GENERAL_STEP_FEEDBACK_BUTTON_TITLE=EOxdGRk9OTg3ruvGWw9ZlQ_Feedback
TXT_TOUR_GENERAL_STEP_FEEDBACK_BUTTON_DESCRIPTION=ku1gNCfe0ZoP71/fUM9idw_This lets you provide feedback specifically on the UI Adaptation mode.

TIT_TOUR_GENERAL_STEP_EXIT_BUTTON_TITLE=rLrqJsHU1Ng0LRJUSpm6CA_Exit UI Adaptation
TXT_TOUR_GENERAL_STEP_EXIT_BUTTON_DESCRIPTION=GPdSC34+cTBcosAYdLT9Ew_When you're done with your UI changes, use the Exit Button to return to your running app.


BTN_LEARN_MORE_WHATS_NEW_DIALOG=gUiDIxDtgK+BoHdF33AX9w_Learn More
BTN_BACK_WHATS_NEW_OVERVIEW_DIALOG=jCU5zdFtG+EML5nN5e5bnw_Back
TXT_DONT_SHOW_AGAIN_WHATS_NEW_DIALOG=Sg7QWJs2t8MGr9FS1wwzhA_Do not show again
TIT_WHATS_NEW_DIALOG=X9OVTEzTL8C9tL6HHtjA6A_What's New in Key User Adaptation
TIT_WHATS_NEW_DIALOG_OVERVIEW=Rv53JbvZ6kkR1uBAjNLd9A_Overview of New Features

TIT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_TITLE=SydeXOEHwJaB59jfwvihVw_"What's New" for Key Users
TXT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_DESCRIPTION=gNn7HthxfQHnaj5bO7IEhQ_Introducing our "What's New" dialog - stay updated on the latest features and improvements
TXT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_TEXT=tVg7TG0FYbbhruHIZ7hVNQ_We're excited to introduce our "What's New" dialog. This dialog will keep you informed about the latest updates, features, and improvements in key user adaptation. Stay up-to-date with all the new functions and enhancements designed to improve your (key) user experience.
TXT_WHATS_NEW_DIALOG_WHATS_NEW_OVERVIEW_TEXT=jKG9XRGoqwdW9sZM/Za0IQ_After an upgrade, we will automatically show the new features introduced with the new version. If you're interested in features from previous versions, you can find an overview through the toolbar's menu icon.

TIT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_TITLE=7sjxybXAzqTjGho/oEvI1Q_Harmonized Context Menu
TXT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_DESCRIPTION=GPy9E5xVHcGdnwp0UcSFRw_The context menu style is now consistent when you select elements.
TXT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_TEXT=g/djXuyO8o92aBdiOwbQoQ_The context menu no longer differs based on how you select an element, such as using the left or right mouse button. The familiar right-click context menu now also appears when you left-click an element.

TIT_WHATS_NEW_RTA_TOUR_TITLE=zD8pBpOd9rQX5O5Le3KjgQ_UI Adaptation Tour
TXT_WHATS_NEW_DIALOG_RTA_TOUR_DESCRIPTION=ss8/yosAQiUU4fOTQOCLrw_The UI Adaptation Tour offers an overview of all core features of UI Adaptation.
TXT_WHATS_NEW_DIALOG_RTA_TOUR_TEXT=7g00UmHxxT15Ryl6m4Cdlw_The UI Adaptation Tour provides an overview of all core features of UI Adaptation. To start the tour, open the "More Actions" menu and select "UI Adaptation Tour".

TIT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TITLE=WODHS0I0ToNLkREWtHv2tw_Embedded Content Sandbox Customization
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_DESCRIPTION=Ef+z0TFjwKVWSoJvvt7Oxg_You can now adjust sandbox properties in the Define Embedded Content dialog under Advanced Settings.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT=f3lPRARA+GYG9ykmNPSsBw_You can now customize the properties of the Embedded Content sandbox when adding or editing embedded content.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT_2=OMUUb056JVKLnvLtWsikRA_In the <strong>Advanced Settings</strong> section, you can now change the sandbox properties according to your use case. The properties <strong>allow-forms</strong>, <strong>allow-scripts</strong>, and <strong>allow-same-origin</strong> are enabled by default for new Embedded Content, providing a sensible default for most applications.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT_3=+38de8IQUd5gFFgPjhViSA_If your use case requires further sandbox permissions, please refer to the <a href\="https\://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe\#sandbox" target\="_blank">documentation</a>.

TIT_WHATS_NEW_RENAME_REWORK_TITLE=IgJWIvdFsE4ZIuikDgJk7A_Rename Rework
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_DESCRIPTION=NKkC3efbNKpebd2XJwaQIQ_We have made some changes to the rename functionality in UI Adaptation.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_1=7hnUSxaK2xWR0zWpNeh7bw_The process for renaming textual elements has been improved. Each rename action now opens a dialog. Many texts support renaming the underlying property, so changes made this way are visible throughout the application wherever this text appears.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_2=SvwnisJBZU+CAv4VlBsE1A_For example, a field might be present in a filter bar as a filter, in the corresponding table as a column, and as a field in the detail page's form control. Renaming one of these entries, e.g., by selecting "Change Labels" in the filter bar, will also affect the column of the table and the form's field.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_3=emfoo6TkZrzaRIvd8IwlLQ_You can rename fields in a form individually by selecting the "Rename" action. To see the effects of these changes, you need to restart the application. If you make such a change, the toolbar includes a button that restarts the application for you and automatically enters UI adaptation mode.

TIT_WHATS_NEW_TEXT_ARRANGEMENT_TITLE=sdXdGnrhEjfLdsSTv4KRvQ_Change Text Arrangement
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_DESCRIPTION=YdcJQNd8QzUrguEIuVhWqg_Key users can now change the display behavior of texts that support this feature.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_1=qG2h32egfZeRW9up234Cng_Most applications now support changing the text arrangement or display behavior of their fields. FilterBar, most Tables, and Forms include a "Change Text Arrangement" action. This feature lets key users decide if fields should be represented by their ID, their textual representation, or both.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_2=JUzP289nJjjnAaVECabTzg_This change applies to the underlying property, so you can observe the desired display behavior wherever the property's text is used. It's not just the control used to create this change that's affected.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_3=G3r83P/P1n6ThyHfjGPSyw_To see the effect of these changes, you need to restart the application. If you create such a change, the toolbar contains a button that restarts the application for you and automatically enters UI adaptation.

TIT_WHATS_NEW_EXTENDED_ACTIONS_TITLE=vrsrLLp0t8/TBzZVwSzpKQ_Extended Actions
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_DESCRIPTION=cbjwARbpqcoxZe/VVukw4Q_Important actions are now presented more centrally.
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_TEXT_1=sLJnVEf+q29FncEFQ4OxyA_Certain actions are of central importance for their respective controls and should also be accessible from their sub-controls.
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_TEXT_2=APNE6v7KzqERRCPSPHUxJA_When working, for example, with a Table, key users should always be able to access the Table settings directly, even when selecting the toolbar or a column. Such actions will be propagated to the context menu of child controls, so they are always just one click away. On the right side of the menu entry, we show the control that propagated the action.
