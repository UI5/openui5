---
specVersion: "4.0"
type: library
metadata:
  name: sap.f
  copyright: |-
   OpenUI5
    * (c) Copyright ${currentYear} SAP SE or an SAP affiliate company.
    * Licensed under the Apache License, Version 2.0 - see LICENSE.txt.
resources:
  configuration:
    propertiesFileSourceEncoding: ISO-8859-1
builder:
  jsdoc:
    excludes:
      - "sap/f/thirdparty/**"
  bundles:
    - bundleDefinition:
        name: sap/f/_library-content.js
        sections:
          - mode: provided
            filters: &filters-for-externals
              - "**/"                    # assume everything as provided ...
              - "!sap/f/"                # ... except the modules from sap/f
              - "sap/f/**/manifest.json" # never bundle manifest (manifest first)
              - "**/designtime/"         #
              - "**/*.designtime.js"     # also exclude all designtime ...
              - "**/*.support.js"        # ... and support files
            resolve: false
          - mode: provided
            filters: &filters-library-preload
              - "sap/f/library.js"
            resolve: true
          - mode: preload
            filters: &filters-library-content
              - sap/f/
              - "!sap/f/gen/"
              - "!sap/f/thirdparty/"
            resolve: false
            resolveConditional: false
            renderer: true
      bundleOptions:
        optimize: true
    - bundleDefinition:
        name: sap/f/library-preload.js
        sections:
          - mode: provided
            filters: *filters-for-externals
            resolve: false
          - mode: preload
            name: sap/f/library-preload.js
            filters: *filters-library-preload
            resolve: true
            resolveConditional: false
            renderer: true
          - mode: bundleInfo
            name: sap/f/_library-content.js
            filters: *filters-library-content
            resolve: false
            resolveConditional: false
          - mode: bundleInfo
            name: sap/f/library-webcomponents-preload.js
            filters:
              - sap/f/gen/
              - sap/f/thirdparty/ui5/ # special entry points for AllIcons files
            resolve: false
      bundleOptions:
        optimize: true
    - bundleDefinition:
        name: sap/f/library-webcomponents-preload.js
        sections:
          - mode: preload
            name: sap/f/library-webcomponents-preload.js
            filters:
              - sap/f/gen/
              - sap/f/thirdparty/
              - "!sap/f/thirdparty/_dynamics/"
            resolve: false
            resolveConditional: false
            renderer: true
      bundleOptions:
        optimize: true

