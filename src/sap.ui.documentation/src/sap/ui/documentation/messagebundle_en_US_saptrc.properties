WELCOME_BLOCK_2_TITLE=9XOzkf25+TNJgErJaPdxAA_Responsive Across Browsers and Devices
WELCOME_BLOCK_2_TEXT=HK9pZ0/D+CstEFHNJ1Lqkw_No need to worry about device specifics\! UI5 apps run on smartphones, tablets, and desktops. The UI controls automatically adapt themselves to the capabilities of each device and make the most of the available real estate.
WELCOME_BLOCK_2_IMG_ALT=iXjDsNDRlGKUBt2EuH9LIg_Picture showing phone, desktop screen and tablet
WELCOME_BLOCK_3_TITLE=2XQT47SEPwn7SfuHwqrR5A_Powerful Development Concepts
WELCOME_BLOCK_3_TEXT_1=dqS4Xy9mYKCXkyCx2PV5Ug_UI5 was created by professionals for modern developers to build state of the art web applications. It comes with all features needed to cover most current application requirements. The UI5 core offers a solid foundation that simplifies your work by managing many aspects of modern development behind the scenes\:
WELCOME_BLOCK_3_TEXT_2=WMJ6cqF/1xzeTp2TxhOlkA_Includes standards like MVC and various data-binding types
WELCOME_BLOCK_3_TEXT_3=6dGsPqob74hM63VrHTzkzA_Choice of different view formats (XML, HTML, JavaScript, JSON)
WELCOME_BLOCK_3_TEXT_4=wQobniv8/fnSZUfbJ8UWUA_Binding with OData, JSON, XML and other data formats
WELCOME_BLOCK_3_TEXT_5=chKONIbrVWP8rorhOzmnuQ_Built-in support tool for exploring the object tree and binding status
WELCOME_BLOCK_3_TEXT_6=o4HgEw/yI5yGVaCloaP9Pw_Translation and internationalization support
WELCOME_BLOCK_3_TEXT_7=5iG67z4Lu/3TOATPwuOoIw_Extensibility concepts at code and application level
WELCOME_BLOCK_4_TITLE=WAQjo6FqCXQ5ZN+eRtHC9g_Enterprise-Ready Web Toolkit
WELCOME_BLOCK_4_TEXT_1=ZpyzgSIYv9UAuzn4FyYqKw_Why is UI5 used by all major SAP products as well as by many customers and partners? And why is it also successful in the open-source community beyond SAP? Here are some of the most important value addeds that UI5 delivers\:
WELCOME_BLOCK_4_TEXT_2=viqCmAS80mt2F5bBe/Rrfg_Translation and internationalization support
WELCOME_BLOCK_4_TEXT_3=HyhvQ4tqS8gEf60FRT4wRA_Extensibility concepts at code and application level
WELCOME_BLOCK_4_TEXT_4=XyPpPKipsNNuGemzu+ZaAg_High Contrast theme to aid visually impaired users
WELCOME_BLOCK_4_TEXT_5=Nvmmq+bZY6dXmhoQg5cQ5g_Easy to integrate into a consistent SAP ecosystem
WELCOME_BLOCK_4_TEXT_6=7UIG+b3Qul2h3XB7c8aoFQ_Flexible tools for any type of developer
WELCOME_BLOCK_4_TEXT_7=3KSb6Ud9PVdFy4Vn8YG9lA_Benefit from new innovations while staying upgrade-compatible
WELCOME_BLOCK_4_TEXT_8=/9V2arjh5ejwF4lsx4ho/A_Unlimited usage in SAP and non-SAP technology stacks
WELCOME_BLOCK_5_TITLE=8xh80X+KXBpdXAOugZzUhA_Award-Winning SAP Fiori Design in Action
WELCOME_BLOCK_5_TEXT=TWHrK/AWBAX4PrHcny07Ew_UI5 applications benefit from a consistent design language and predefined UX patterns across all frontend features. Use a predefined theme or try our online theming tool to create a custom theme.
WELCOME_BLOCK_5_IMG_ALT=Fj37ZG3ZUIzJrKLY+42LEg_Picture showing SAP Fiori design elements
WELCOME_BLOCK_6_TITLE=o/DPZmcKjva9gD6xBQd6rQ_Get Ready
WELCOME_BLOCK_6_TEXT_1=R8v/55P0n452TfuV0IHMnw_All you need to develop Web apps with UI5 is a development environment and a browser. For maximum convenience, you can use SAP Business Application Studio in the cloud. For maximum flexibility, you have the alternative choice of setting up your local development environment.
WELCOME_BLOCK_6_TEXT_2=QW4vFzSrFmo4GZv6vGJ9WQ_Try the first example here\:
WELCOME_BLOCK_7_TITLE=Xy+Y2ctjsrI+SJGC2xk6Dw_UI5 Evolution
WELCOME_BLOCK_7_TEXT_1=unb8KeEU7AJLgrCxuV/upA_UI5 evolution stands for fundamental improvements as part of an ongoing effort to advance SAPUI5, to enable applications to run faster, and code to become more modular. By embracing web standards, asynchronous loading, and emerging technologies, SAPUI5 continues to be a future-proof, enterprise-proven solution.
WELCOME_BLOCK_7_TEXT_2=pv0AOsmlB5yzPu9F99/JCw_We encourage developers to actively support and leverage the new capabilities.
WELCOME_BLOCK_7_ALT=nUhSJObh+rqlDrYtHTeq5w_The UI5 evolution is creating innovation, providing build tooling, modular core, open standards, and gaining high performance using asynchronous loading.
WELCOME_BLOCK_8_TITLE=y+qZGt8mfD6OJRTOmvTiEA_SAPUI5 on SAP BTP
WELCOME_BLOCK_8_TEXT_1=uUK7Fnxr0vWD05KTpMPqjg_Sign up for the free SAP BTP trial account to test the platform and build cloud-based UI5 apps.
WELCOME_BLOCK_8_TEXT_2=UPEzlEu3pNFsA0CHibZ6mg_Easy-to-use development environment with SAP Business Application Studio
WELCOME_BLOCK_8_TEXT_3=snknXXS199F2EhGMkIxuwQ_Free trial for development use
WELCOME_BLOCK_9_TITLE=EiX0SYzjWnc1m/D6QSGpMg_SAPUI5 (On-Premise)
WELCOME_BLOCK_9_TEXT_1=Wy+Ou3w5kxtoDfltnPTeUw_SAPUI5 is part of the user interface technologies in SAP HANA, NetWeaver ABAP, and Java systems.
WELCOME_BLOCK_9_TEXT_2=KOWfICuZslYVZAeqUzpPdg_Ready to use for SAP customers
WELCOME_BLOCK_9_TEXT_3=vlnI78X8IJLFHHx3I1ZaFg_Integrates with existing system landscapes
WELCOME_BLOCK_10_TITLE=i9omfPrblLKYp3Ojh1dWxg_OpenUI5 - Free and Open Source
WELCOME_BLOCK_10_TEXT_1=EgXQSd0s+YviW8m5uxG7yQ_Try the open source variant of UI5. It contains all core UI5 features and is available on GitHub under the Apache 2.0 license.
WELCOME_BLOCK_10_TEXT_2=UFAR1Wp/j98z77a+oqnpVw_Supported by the open source community
WELCOME_BLOCK_10_TEXT_3=+s1r1wCxf/x7/t3ETf6o2g_Managed on GitHub - contributions welcome\!
WELCOME_BLOCK_11_TITLE=VWBKzcR81iQCO+8e+WMKAA_UI5 on Content Delivery Network
WELCOME_BLOCK_11_TEXT_1=gNg5C4zqjJJspJs2e6n7EQ_Develop and run UI5 apps with the flexibility of a robust CDN. Files are loaded from the location closest to the user for optimal performance.
WELCOME_BLOCK_11_TEXT_2=nskRYSP7aaf6QgINNu9a9g_Multi-version CDN to maintain a custom lifecycle
WELCOME_BLOCK_11_TEXT_3=oIbch9ZBhyCtYIC3KqEsIA_For any on-premise and cloud development scenario
WELCOME_BLOCK_12_TITLE=cCe6+0cmfiIE1oWuFXTGhQ_SAP Community
WELCOME_BLOCK_13_TITLE=9NV0fujNf15zkHt6+iG2Xw_Newsletter
WELCOME_BLOCK_14_TITLE=gfnEY6wyxCXNONWymct1hA_SAP Fiori Development Portal
WELCOME_BLOCK_14_TEXT=N52g2o8DC7QMgAE037N3Bg_Explore the features and adaptation options of SAP Fiori elements for OData V4 in real time to rapidly and easily create metadata-driven SAP Fiori apps. To get started, choose your set of building blocks from predefined floorplans or custom pages using the SAP Fiori Development Portal.
WELCOME_BLOCK_14_IMG_ALT=E0zAytOfo4CLFAe2Bmu23g_Screenshot of SAP Fiori Development Portal
WELCOME_VIDEO_BLOCK_TITLE=C/wHQPcSSSe2YZ5BVbUldg_What is SAPUI5?

WELCOME_VIDEO_BLOCK_TEXT_1=JR2iqgMTYbLE2m4hQkViKw_SAPUI5 is an HTML5 framework for creating cross-platform, enterprise-grade web applications in an efficient way. What started as a small project is now one of the most successful technologies ever invented by SAP.
WELCOME_VIDEO_BLOCK_TEXT_2=M8a6izi1rZWkwaa0Bd0U1g_In this video, you can grasp the value of SAPUI5 in 110 seconds. On our SAP Community page, you can deep dive into more details of our leading UI technologies <a href\="https\://community.sap.com/topics/ui5">here</a>.

