WELCOME_BLOCK_2_TITLE=vy9PInxkUZyrawjp4iumjQ_Responsive Across Browsers and Devices
WELCOME_BLOCK_2_TEXT=fK6nuAc6incnLHURQX+bVg_No need to worry about device specifics\! UI5 apps run on smartphones, tablets, and desktops. The UI controls automatically adapt themselves to the capabilities of each device and make the most of the available real estate.
WELCOME_BLOCK_2_IMG_ALT=o0t+HZUE5Dow16ePcaye9w_Picture showing phone, desktop screen and tablet
WELCOME_BLOCK_3_TITLE=coOTPadXCdh45eZHwrJPMw_Powerful Development Concepts
WELCOME_BLOCK_3_TEXT_1=8WpTj7/Q+MRD6PBwbkRlog_UI5 was created by professionals for modern developers to build state of the art web applications. It comes with all features needed to cover most current application requirements. The UI5 core offers a solid foundation that simplifies your work by managing many aspects of modern development behind the scenes\:
WELCOME_BLOCK_3_TEXT_2=bEPJIjISerm6+tVxJ6/IUw_Includes standards like MVC and various data-binding types
WELCOME_BLOCK_3_TEXT_3=d/ksIKK/DdApSmnH9XJ9fw_Choice of different view formats (XML, HTML, JavaScript, JSON)
WELCOME_BLOCK_3_TEXT_4=ZKUxS4Ln2u0b8OTvZmmiUw_Binding with OData, JSON, XML and other data formats
WELCOME_BLOCK_3_TEXT_5=8b1vP1DdkQea6iDLZeByTQ_Built-in support tool for exploring the object tree and binding status
WELCOME_BLOCK_3_TEXT_6=/R+98dbhJkUgTr5I02KgUw_Translation and internationalization support
WELCOME_BLOCK_3_TEXT_7=9rXEBmszqzUHFNXTwV0tPA_Extensibility concepts at code and application level
WELCOME_BLOCK_4_TITLE=QXjAPRVJL1fL+UCEfDLvYw_Enterprise-Ready Web Toolkit
WELCOME_BLOCK_4_TEXT_1=jNl8XYd087NJkVCRImweeg_Why is UI5 used by all major SAP products as well as by many customers and partners? And why is it also successful in the open-source community beyond SAP? Here are some of the most important value addeds that UI5 delivers\:
WELCOME_BLOCK_4_TEXT_2=bhsJCGjcRYqSIfWPuR2Lkw_Translation and internationalization support
WELCOME_BLOCK_4_TEXT_3=yn8PbpdR41aRrPFoE6AtMQ_Extensibility concepts at code and application level
WELCOME_BLOCK_4_TEXT_4=GkVqw/aEaHCr1LxCXYE3+g_High Contrast theme to aid visually impaired users
WELCOME_BLOCK_4_TEXT_5=oqjZnK0YZrjGHZUNJPoOLA_Easy to integrate into a consistent SAP ecosystem
WELCOME_BLOCK_4_TEXT_6=8GCgIrYfdiYIB/C4lDYPjA_Flexible tools for any type of developer
WELCOME_BLOCK_4_TEXT_7=jvSMP5cDkpF+0NVicxMLmA_Benefit from new innovations while staying upgrade-compatible
WELCOME_BLOCK_4_TEXT_8=TBmX5McMvZGpwcswDbkvTA_Unlimited usage in SAP and non-SAP technology stacks
WELCOME_BLOCK_5_TITLE=Tis4Z3fEAoFwAM05tqsUQQ_Award-Winning SAP Fiori Design in Action
WELCOME_BLOCK_5_TEXT=eteR96WRiH33WBQGpb4Vlg_UI5 applications benefit from a consistent design language and predefined UX patterns across all frontend features. Use a predefined theme or try our online theming tool to create a custom theme.
WELCOME_BLOCK_5_IMG_ALT=x4lWbBdG7xwVU/lkbSlRKQ_Picture showing SAP Fiori design elements
WELCOME_BLOCK_6_TITLE=h3nqOY5tVXx0m3kuJGflhA_Get Ready
WELCOME_BLOCK_6_TEXT_1=fMmuoAf6hP5OFBC31K+ouQ_All you need to develop Web apps with UI5 is a development environment and a browser. For maximum convenience, you can use SAP Business Application Studio in the cloud. For maximum flexibility, you have the alternative choice of setting up your local development environment.
WELCOME_BLOCK_6_TEXT_2=ce7DtwavJc9wi44M/nFXcg_Try the first example here\:
WELCOME_BLOCK_7_TITLE=18bzy1j2voEYjWP/pokfPg_UI5 Evolution
WELCOME_BLOCK_7_TEXT_1=zuYMPM0neI6V8pmYb+/Hxg_UI5 evolution stands for fundamental improvements as part of an ongoing effort to advance SAPUI5, to enable applications to run faster, and code to become more modular. By embracing web standards, asynchronous loading, and emerging technologies, SAPUI5 continues to be a future-proof, enterprise-proven solution.
WELCOME_BLOCK_7_TEXT_2=Vqjjcjogw5Z6IyxjYBdt6A_We encourage developers to actively support and leverage the new capabilities.
WELCOME_BLOCK_7_ALT=VOJVDa3fMVXJp/GZ9njU7g_The UI5 evolution is creating innovation, providing build tooling, modular core, open standards, and gaining high performance using asynchronous loading.
WELCOME_BLOCK_8_TITLE=fvyjBaD6hISeNDJ1tOo3GQ_SAPUI5 on SAP BTP
WELCOME_BLOCK_8_TEXT_1=UMqur+wWnoFlf8KRa3ojXQ_Sign up for the free SAP BTP trial account to test the platform and build cloud-based UI5 apps.
WELCOME_BLOCK_8_TEXT_2=JKZCxo2VuLf6iSB1/NVr/A_Easy-to-use development environment with SAP Business Application Studio
WELCOME_BLOCK_8_TEXT_3=ikP76wMZtNJagVUywCsafw_Free trial for development use
WELCOME_BLOCK_9_TITLE=yrzNduDLVXQePcJg+oL0nA_SAPUI5 (On-Premise)
WELCOME_BLOCK_9_TEXT_1=duPr3bCLMyPbjo1cwb4mSg_SAPUI5 is part of the user interface technologies in SAP HANA, NetWeaver ABAP, and Java systems.
WELCOME_BLOCK_9_TEXT_2=0Zae5qTzHhSnAGi6QhkiYg_Ready to use for SAP customers
WELCOME_BLOCK_9_TEXT_3=vvUQfN/4pUnF7GOg1jhr0A_Integrates with existing system landscapes
WELCOME_BLOCK_10_TITLE=3YjjZjiiI7dK5FBinFawIA_OpenUI5 - Free and Open Source
WELCOME_BLOCK_10_TEXT_1=0a1dZz1vkqFtmnRKl1ql2g_Try the open source variant of UI5. It contains all core UI5 features and is available on GitHub under the Apache 2.0 license.
WELCOME_BLOCK_10_TEXT_2=Pt69DCJTi3guyEQja8Xnvg_Supported by the open source community
WELCOME_BLOCK_10_TEXT_3=gexL4Qy2PZwYKGESK72NXQ_Managed on GitHub - contributions welcome\!
WELCOME_BLOCK_11_TITLE=2efzZCOFCtvrvgaic/Ivng_UI5 on Content Delivery Network
WELCOME_BLOCK_11_TEXT_1=UcUsuCbjLja00WBA4yB30A_Develop and run UI5 apps with the flexibility of a robust CDN. Files are loaded from the location closest to the user for optimal performance.
WELCOME_BLOCK_11_TEXT_2=N22sIBtmtnizZuqEjycw3Q_Multi-version CDN to maintain a custom lifecycle
WELCOME_BLOCK_11_TEXT_3=Sy6luPe1FC8YkulDbC58Ig_For any on-premise and cloud development scenario
WELCOME_BLOCK_12_TITLE=BrWGLjD/PUOVtSCaMeMxOw_SAP Community
WELCOME_BLOCK_13_TITLE=hJt9FOwr0DPMRJro3JXy2w_Newsletter
WELCOME_VIDEO_BLOCK_TITLE=VML3gN8ueABurtpr967q8Q_What is SAPUI5?

WELCOME_VIDEO_BLOCK_TEXT_1=KG78YEzzB6jgMOF23KGHXA_SAPUI5 is an HTML5 framework for creating cross-platform, enterprise-grade web applications in an efficient way. What started as a small project is now one of the most successful technologies ever invented by SAP.
WELCOME_VIDEO_BLOCK_TEXT_2=/kHeuv6kh3hU/4oOG/54eQ_In this video, you can grasp the value of SAPUI5 in 110 seconds. On our SAP Community page, you can deep dive into more details of our leading UI technologies <a href\="https\://community.sap.com/topics/ui5">here</a>.

