RESOURCES_CARD_TITLE_FIORI_DEV_PORTAL=un5vQvpFUEOkdN8Z0x00jw_SAP Fiori Development Portal
RESOURCES_CARD_DESC_FIORI_DEV_PORTAL=VrJzhph7sOCCVOhSd91YCg_Select your set of building blocks. Explore SAP Fiori elements for OData V4 features and building blocks in real time, and see how you can adapt them in your custom layouts or when extending predefined floorplans.
RESOURCES_CARD_TITLE_ICON_EXPLORER=RKWJqlKiTVLC7R/PNW2zEw_Icon Explorer
RESOURCES_CARD_DESC_ICON_EXPLORER=uNY+XGD6FZl1WTDCJWCnog_The right icons speak louder than words. Use our large collection of icons in our icon fonts to find the best ones for your app project.
RESOURCES_CARD_TITLE_ACC_GUIDE=Cu3IB0SUo4FblZdfAI5OUQ_Accessibility Guide
RESOURCES_CARD_DESC_ACC_GUIDE=56lOFB2wG5eMfoZNAOTuwQ_The Accessibility Guide provides in-depth information with examples about web accessibility, whether you are a control or application developer, or a business user searching to learn more about web accessibility in the SAPUI5 area.

RESOURCES_CATEGORY_TITLE_DEV_TOOLS=sFtFsjIN7SL5UW/nZPgmXw_Development Tools
RESOURCES_CARD_TITLE_TOOLING=kSVdX5qfszppJhn4Y3gJnQ_UI5 Tooling
RESOURCES_CARD_DESC_TOOLING=rigRJYO9h9LObyy85Xczvw_UI5 Tooling is a state-of-the-art modular toolchain to develop UI5 projects by consuming UI5 via npm. It is an open-source, modular, configurable, and extensible CLI to efficiently develop apps, libraries, and reuse components with the UI5 framework.
RESOURCES_CARD_TITLE_FIORI_TOOLS=tsmrdHGPkO9+bF5/xpB1JA_SAP Fiori Tools
RESOURCES_CARD_DESC_FIORI_TOOLS=Co4rXOWOzShOT0xipCJfug_SAP Fiori tools simplifies the creation of SAP Fiori elements applications by providing extensions for your SAP Business Application Studio and Visual Studio Code development environments.
RESOURCES_CARD_TITLE_CARD_EXPLORER=kFm75ShFR8sUek4vtoeRVw_Card Explorer
RESOURCES_CARD_DESC_CARD_EXPLORER=LqPCsFrMGCEyr4olmim0tQ_Integration cards are a great way to provide business content for users on widget-like cards on home pages or dashboards. The Card Explorer shows you everything you need to know to implement them.
RESOURCES_CARD_TITLE_LINTER=QbTLRTK6kIP7ISn+I6UsyA_UI5 linter
RESOURCES_CARD_DESC_LINTER=Pp9JZPIuGH4eiY6R7Gl8pg_UI5 linter is a static code analysis tool for UI5 projects. It checks JavaScript, XML, JSON, and other files in your project, and reports findings. It helps you follow best practices in your UI5 projects and to adapt them to new UI5 major versions.
RESOURCES_CARD_TITLE_BUSINESS_APP_STUDIO=ltT7z5tQZWTeJGsdOJXO9A_SAP Business Application Studio
RESOURCES_CARD_DESC_BUSINESS_APP_STUDIO=5zsrDa7qWT9eF95Y1HMRBQ_SAP Business Application Studio (BAS) is a modern cloud-based development environment, tailored for efficient development and extension of business applications for intelligent enterprises.

RESOURCES_CATEGORY_TITLE_CUSTOMISING=zQlNOJuq5+Bql1O8KQz1FQ_Customizing
RESOURCES_CARD_TITLE_THEME_DESIGNER=OVuA1u0Bik+i7Dzf9JFa3A_UI Theme Designer
RESOURCES_CARD_DESC_THEME_DESIGNER=YY4dfIrnn21CuUA/obR9Vw_UI theme designer is a browser-based tool for theming and branding key SAP user interfaces. Use it to build your corporate identity themes quickly and easily by modifying theme templates provided by SAP.
RESOURCES_CARD_TITLE_THEME_PARAMETER_TOOLBOX=XirD0Y4iI3s4Ub5gq8YQ5w_Theme Parameter Toolbox
RESOURCES_CARD_DESC_THEME_PARAMETER_TOOLBOX=ki2MjYFDNCu+YrQy/V9Gjg_With the theme parameter toolbox, you can search, filter, and preview semantic theme parameters. It covers current and past themes offered by SAP.
RESOURCES_CARD_TITLE_FLEXIBILITY=LtcKhTwy5Uxp6Z7+SXqoqw_SAPUI5 Flexibility
RESOURCES_CARD_DESC_FLEXIBILITY=ddNZu3Ej+qrViT52hP0DAQ_With SAPUI5 flexibility, developers, key users, and end users can shape the UI of SAPUI5 apps to provide a tailored user experience - without having to touch the source code.

RESOURCES_CATEGORY_TITLE_TROUBLESHOOTING=nnDoYEW/TYe/D+SeGMGQNw_Troubleshooting
RESOURCES_CARD_TITLE_INSPECTOR=XQmUD4ItX0u9xPWYAsBtsw_UI5 Inspector
RESOURCES_CARD_DESC_INSPECTOR=AbXfc8ptHB0zoCPwPPde0w_UI5 Inspector is an an open-source Chrome DevTools extension that you can use to easily debug and support your OpenUI5 or SAPUI5-based apps.
RESOURCES_CARD_TITLE_SUPPORT_ASSISTANT=BfOkG8NAmfHNtXPb0pgwbQ_Support Assistant
RESOURCES_CARD_DESC_SUPPORT_ASSISTANT=DSqCNF3dgTaZoI1poMyKjQ_The support assistant enables developers to check whether their apps are built according to SAPUI5 best practices and guidelines.

RESOURCES_CATEGORY_TITLE_TESTING=h+Vp/JdN0F4dqRzVpYH+WQ_Testing
RESOURCES_CARD_TITLE_TEST_RECORDER=yF8JhvxoY5pnesPLdggFCw_Test Recorder
RESOURCES_CARD_DESC_TEST_RECORDER=6wMWHYq1lFr8K6VvowLb1Q_The Test Recorder helps you to create UI5 integration and system tests by recording your actions in the browser.
RESOURCES_CARD_TITLE_WDI5=ruYEiakSAXAQ8wbRDW7NWA_wdi5
RESOURCES_CARD_DESC_WDI5=24laxOU7j/2Q62Ad5mVYvQ_wdi5 is a Webdriver.IO service that uses UI5's test API. It is designed to run cross-platform end-to-end tests on a SAPUI5 application with selectors that are compatible to OPA5.

