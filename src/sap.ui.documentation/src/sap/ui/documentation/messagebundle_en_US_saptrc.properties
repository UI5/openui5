WELCOME_BLOCK_2_TITLE=RVhqLNUvqg3LM7Lv6KoNSQ_Responsive Across Browsers and Devices
WELCOME_BLOCK_2_TEXT=/hbUvuraiB/FdWtXDPPOrg_No need to worry about device specifics\! UI5 apps run on smartphones, tablets, and desktops. The UI controls automatically adapt themselves to the capabilities of each device and make the most of the available real estate.
WELCOME_BLOCK_2_IMG_ALT=3isDMqOgg+oR/WemQcbr5w_Picture showing phone, desktop screen and tablet
WELCOME_BLOCK_3_TITLE=zSbxjXV+z/zfmPU/7LgVCw_Powerful Development Concepts
WELCOME_BLOCK_3_TEXT_1=oSNEGHbofC8mhN7AblDTCg_The UI5 core offers a solid foundation that simplifies your work by managing many aspects of modern development behind the scenes. It comes with built-in support for architectural concepts like MVC, two-way data binding, and routing.
WELCOME_BLOCK_3_TEXT_2=66I7iu7LYPIe6hlq7GdiOQ_Includes standards like MVC and various data-binding types
WELCOME_BLOCK_3_TEXT_3=ZH6du0F597HXsZ5FWQjO2g_Choose between different view formats (XML, HTML, JavaScript, JSON)
WELCOME_BLOCK_3_TEXT_4=XB3BxARvbeFrveT32uCzeg_Binding with OData, JSON, XML and other data formats
WELCOME_BLOCK_3_TEXT_5=nl14Z7qvh3twqvCZG+WnaA_Built-in support tool for exploring the object tree and binding status
WELCOME_BLOCK_4_TITLE=IsdwYo3DjPWKCVKU2j87Pg_Enterprise-Ready Web Toolkit
WELCOME_BLOCK_4_TEXT_1=Ow09UDdhnB3RRLBtvC8Ilw_Created by professionals, for modern developers building state of the art web applications. It comes with all features needed to cover most current application requirements, with standards high enough to be delivered in standard SAP solutions.
WELCOME_BLOCK_4_TEXT_2=M0tuKo6mQwOPZtS52LMNVw_Translation and internationalization support
WELCOME_BLOCK_4_TEXT_3=s4U6xu/KG6j/xQlckwewnQ_Extensibility concepts at code and application level
WELCOME_BLOCK_4_TEXT_4=a69phxVOtzajXJuCy7KP4g_High Contrast theme to aid visually impaired users
WELCOME_BLOCK_5_TITLE=u/kCTzQBXSTRxIBaaJjb6Q_Award-Winning SAP Fiori Design in Action
WELCOME_BLOCK_5_TEXT=5Ud3gIhojZhNXnMG9LkBKw_UI5 applications benefit from a consistent design language and predefined UX patterns across all frontend features. Use a predefined theme or try our online theming tool to create a custom theme.
WELCOME_BLOCK_5_IMG_ALT=SvTSJRTwR4C2Phr2mbHr+g_Picture showing SAP Fiori design elements
WELCOME_BLOCK_6_TITLE=KhUdKHZay8g25zps5mji7w_Get Ready
WELCOME_BLOCK_6_TEXT_1=gntrBhmZhn1I5P4t2a3XCQ_All you need to develop Web apps with UI5 is a development environment and a browser. For maximum convenience, you can use SAP Business Application Studio in the cloud. For maximum flexibility, you have the alternative choice of setting up your local development environment.
WELCOME_BLOCK_6_TEXT_2=1XSc6acQ77cQoJxItYAV2Q_Try the first example here\:
WELCOME_BLOCK_7_TITLE=5b0nmpGC4iNkR7uCHBAFrw_UI5 Evolution
WELCOME_BLOCK_7_TEXT_1=XxgpwMDa0s67gY0rwHjxaQ_UI5 evolution stands for fundamental improvements as part of an ongoing effort to advance SAPUI5, to enable applications to run faster, and code to become more modular. By embracing web standards, asynchronous loading, and emerging technologies, SAPUI5 continues to be a future-proof, enterprise-proven solution.
WELCOME_BLOCK_7_TEXT_2=gLF/lp67Z3T0z8cI5lf2lA_We encourage developers to actively support and leverage the new capabilities.
WELCOME_BLOCK_7_ALT=wGtsMZdaE327GcRs2hq1UA_The UI5 evolution is creating innovation, providing build tooling, modular core, open standards, and gaining high performance using asynchronous loading.
WELCOME_BLOCK_8_TITLE=ORlHF8oxDjasZJ2mR2IA7Q_SAPUI5 on SAP BTP
WELCOME_BLOCK_8_TEXT_1=MWE8kv9psTasiwGDDUCDyw_Sign up for the free SAP BTP trial account to test the platform and build cloud-based UI5 apps.
